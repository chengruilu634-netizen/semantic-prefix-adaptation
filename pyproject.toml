[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-prefix-adaptation"
version = "0.1.0"
description = "Query high-resolution and anchored memory adaptation modules for Sa2VA/SAM2"
requires-python = ">=3.10"
dependencies = ["torch>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]
